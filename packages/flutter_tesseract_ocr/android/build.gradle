// Copie locale de flutter_tesseract_ocr 0.4.31 (licence BSD-3, voir LICENSE).
// Script de build adapté à Android Gradle Plugin 9 / Gradle 9 pour PediCare :
//   - suppression de jcenter() et du classpath AGP 7.1.2 (fournis par l'app) ;
//   - DSL moderne (compileSdk, lint).
group 'io.paratoner.flutter_tesseract_ocr'
version '1.0'

// Le .aar Tesseract4Android est exposé via un dépôt flatDir (et non comme
// dépendance fichier, refusée par AGP 9 lors de l'assemblage du plugin).
rootProject.allprojects {
    repositories {
        flatDir {
            dirs project(':flutter_tesseract_ocr').file('libs')
        }
    }
}

apply plugin: 'com.android.library'

android {
    namespace "io.paratoner.flutter_tesseract_ocr"
    compileSdk 36

    defaultConfig {
        minSdk 21
    }

    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    api(name: 'tesseract4android-release', ext: 'aar')
}
